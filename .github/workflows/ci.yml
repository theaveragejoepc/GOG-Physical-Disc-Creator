name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Regression tests
        run: dotnet run --project tests/GogDisc.SelfTests -c Release
      - name: Build launcher and creator
        run: dotnet build GOGDiscTool.sln -c Release
